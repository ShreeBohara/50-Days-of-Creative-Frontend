<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#061a24" />
    <meta
      name="description"
      content="MESH / 54 is an animated grainy gradient studio built with Canvas and vanilla JavaScript."
    />
    <title>MESH / 54 — Gradient Studio</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="studio" id="studio">
      <canvas id="mesh-canvas" aria-hidden="true"></canvas>

      <header class="studio-mark">
        <p>50 Days of Creative Frontend · Day 54</p>
        <h1>MESH <span>/54</span></h1>
        <div class="field-status" aria-hidden="true">
          <span class="status-orbit"><i></i></span>
          <span>Generative color field</span>
        </div>
      </header>

      <aside class="control-panel" id="control-panel" aria-label="Mesh gradient controls">
        <header class="panel-header">
          <div>
            <p class="panel-kicker">Gradient instrument</p>
            <h2>Field controls</h2>
          </div>
          <span class="live-chip"><i></i> Live</span>
        </header>

        <form class="control-form" id="control-form">
          <section class="control-section" aria-labelledby="palette-heading">
            <header class="section-header">
              <span>01</span>
              <h3 id="palette-heading">Palette</h3>
            </header>
            <div class="palette-module" id="palette-controls"></div>
          </section>

          <section class="control-section" aria-labelledby="motion-heading">
            <header class="section-header">
              <span>02</span>
              <h3 id="motion-heading">Motion</h3>
            </header>
            <div class="control-stack" id="motion-controls"></div>
          </section>

          <section class="control-section" aria-labelledby="surface-heading">
            <header class="section-header">
              <span>03</span>
              <h3 id="surface-heading">Surface</h3>
            </header>
            <div class="control-stack" id="surface-controls"></div>
          </section>

          <section class="control-section" aria-labelledby="compose-heading">
            <header class="section-header">
              <span>04</span>
              <h3 id="compose-heading">Compose</h3>
            </header>
            <div class="compose-actions" id="compose-controls"></div>
          </section>
        </form>

        <footer class="panel-footer">
          <span id="boot-status">Color field online</span>
          <span>Canvas / sRGB</span>
        </footer>
      </aside>

      <p class="sr-only" id="live-region" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
