name: Deploy Creative Frontend Gallery

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "site.css"
      - "day-01-particle-text/**"
      - "day-02-liquid-glass-card/**"
      - "day-03-solar-system/**"
      - "day-04-audio-visualizer/**"
      - "day-05-terrain-generator/**"
      - "day-06-matrix-rain/**"
      - "day-07-fluid-sim/**"
      - "day-08-flow-field/**"
      - "day-09-masonry-gallery/**"
      - "day-10-periodic-table/**"
      - "day-11-svg-draw-on-scroll/**"
      - "day-12-3d-card-deck/**"
      - "day-13-dna-helix/**"
      - "day-14-retro-terminal/**"
      - "day-15-magnetic-cursor/**"
      - "day-16-sorting-visualizer/**"
      - "day-17-isometric-city/**"
      - "day-18-nbody-gravity/**"
      - "day-19-signal-atlas/**"
      - "day-20-shader-playground/**"
      - "day-21-animated-dashboard/**"
      - "day-22-3d-configurator/**"
      - "day-23-scroll-storytelling/**"
      - "day-24-music-player-ui/**"
      - "day-25-kanban-board/**"
      - "day-26-dependency-graph/**"
      - "day-27-cursor-chat/**"
      - "day-28-infinite-tunnel/**"
      - "day-29-form-wizard/**"
      - ".github/workflows/deploy-pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            day-03-solar-system/package-lock.json
            day-21-animated-dashboard/package-lock.json
            day-22-3d-configurator/package-lock.json
            day-23-scroll-storytelling/package-lock.json
            day-24-music-player-ui/package-lock.json
            day-25-kanban-board/package-lock.json
            day-26-dependency-graph/package-lock.json
            day-27-cursor-chat/package-lock.json
            day-28-infinite-tunnel/package-lock.json
            day-29-form-wizard/package-lock.json

      - name: Install Day 03 app dependencies
        working-directory: day-03-solar-system
        run: npm ci

      - name: Build Day 03 app
        working-directory: day-03-solar-system
        run: npm run build

      - name: Install Day 21 app dependencies
        working-directory: day-21-animated-dashboard
        run: npm ci

      - name: Build Day 21 app
        working-directory: day-21-animated-dashboard
        run: npm run build

      - name: Install Day 22 app dependencies
        working-directory: day-22-3d-configurator
        run: npm ci

      - name: Build Day 22 app
        working-directory: day-22-3d-configurator
        run: npm run build

      - name: Install Day 23 app dependencies
        working-directory: day-23-scroll-storytelling
        run: npm ci

      - name: Build Day 23 app
        working-directory: day-23-scroll-storytelling
        run: npm run build

      - name: Install Day 24 app dependencies
        working-directory: day-24-music-player-ui
        run: npm ci

      - name: Build Day 24 app
        working-directory: day-24-music-player-ui
        run: npm run build

      - name: Install Day 25 app dependencies
        working-directory: day-25-kanban-board
        run: npm ci

      - name: Build Day 25 app
        working-directory: day-25-kanban-board
        run: npm run build

      - name: Install Day 26 app dependencies
        working-directory: day-26-dependency-graph
        run: npm ci

      - name: Build Day 26 app
        working-directory: day-26-dependency-graph
        run: npm run build

      - name: Install Day 27 app dependencies
        working-directory: day-27-cursor-chat
        run: npm ci

      - name: Build Day 27 app
        working-directory: day-27-cursor-chat
        run: npm run build

      - name: Install Day 28 app dependencies
        working-directory: day-28-infinite-tunnel
        run: npm ci

      - name: Build Day 28 app
        working-directory: day-28-infinite-tunnel
        run: npm run build

      - name: Install Day 29 app dependencies
        working-directory: day-29-form-wizard
        run: npm ci

      - name: Build Day 29 app
        working-directory: day-29-form-wizard
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage static site bundle
        run: |
          mkdir -p _site
          cp index.html site.css _site/
          cp -R day-01-particle-text _site/
          cp -R day-02-liquid-glass-card _site/
          cp -R day-04-audio-visualizer _site/
          cp -R day-05-terrain-generator _site/
          cp -R day-06-matrix-rain _site/
          cp -R day-07-fluid-sim _site/
          cp -R day-08-flow-field _site/
          cp -R day-09-masonry-gallery _site/
          cp -R day-10-periodic-table _site/
          cp -R day-11-svg-draw-on-scroll _site/
          cp -R day-12-3d-card-deck _site/
          cp -R day-13-dna-helix _site/
          cp -R day-14-retro-terminal _site/
          cp -R day-15-magnetic-cursor _site/
          cp -R day-16-sorting-visualizer _site/
          cp -R day-17-isometric-city _site/
          cp -R day-18-nbody-gravity _site/
          cp -R day-19-signal-atlas _site/
          cp -R day-20-shader-playground _site/
          mkdir -p _site/day-03-solar-system
          cp -R day-03-solar-system/dist/. _site/day-03-solar-system/
          mkdir -p _site/day-21-animated-dashboard
          cp -R day-21-animated-dashboard/dist/. _site/day-21-animated-dashboard/
          mkdir -p _site/day-22-3d-configurator
          cp -R day-22-3d-configurator/dist/. _site/day-22-3d-configurator/
          mkdir -p _site/day-23-scroll-storytelling
          cp -R day-23-scroll-storytelling/dist/. _site/day-23-scroll-storytelling/
          mkdir -p _site/day-24-music-player-ui
          cp -R day-24-music-player-ui/dist/. _site/day-24-music-player-ui/
          mkdir -p _site/day-25-kanban-board
          cp -R day-25-kanban-board/dist/. _site/day-25-kanban-board/
          mkdir -p _site/day-26-dependency-graph
          cp -R day-26-dependency-graph/dist/. _site/day-26-dependency-graph/
          mkdir -p _site/day-27-cursor-chat
          cp -R day-27-cursor-chat/dist/. _site/day-27-cursor-chat/
          mkdir -p _site/day-28-infinite-tunnel
          cp -R day-28-infinite-tunnel/dist/. _site/day-28-infinite-tunnel/
          mkdir -p _site/day-29-form-wizard
          cp -R day-29-form-wizard/dist/. _site/day-29-form-wizard/

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
